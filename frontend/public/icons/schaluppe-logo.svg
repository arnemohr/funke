<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1E3C"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>

  <!-- Background: deep navy -->
  <rect width="512" height="512" rx="96" fill="url(#sea)"/>

  <!-- Water waves at bottom -->
  <path d="M0 390 Q64 370 128 390 T256 390 T384 390 T512 390 L512 512 L0 512 Z" fill="#142D54" opacity="0.5"/>
  <path d="M0 410 Q64 390 128 410 T256 410 T384 410 T512 410 L512 512 L0 512 Z" fill="#142D54" opacity="0.3"/>

  <!-- Raft hull: two pontoons -->
  <rect x="120" y="310" width="272" height="16" rx="8" fill="#D4A574"/>
  <rect x="140" y="330" width="232" height="10" rx="5" fill="#8B6F4E"/>
  <rect x="140" y="344" width="232" height="10" rx="5" fill="#8B6F4E"/>

  <!-- Deck structure -->
  <rect x="150" y="270" width="212" height="40" rx="4" fill="#C4956A"/>
  <line x1="180" y1="270" x2="180" y2="310" stroke="#A07850" stroke-width="2"/>
  <line x1="220" y1="270" x2="220" y2="310" stroke="#A07850" stroke-width="2"/>
  <line x1="260" y1="270" x2="260" y2="310" stroke="#A07850" stroke-width="2"/>
  <line x1="300" y1="270" x2="300" y2="310" stroke="#A07850" stroke-width="2"/>
  <line x1="340" y1="270" x2="340" y2="310" stroke="#A07850" stroke-width="2"/>

  <!-- Mast -->
  <line x1="256" y1="100" x2="256" y2="270" stroke="#D4A574" stroke-width="6" stroke-linecap="round"/>

  <!-- Flag/pennant at top -->
  <polygon points="259,105 310,120 259,135" fill="#E8722A"/>

  <!-- String lights (festive touch) -->
  <path d="M160 200 Q208 180 256 200 Q304 220 352 200" fill="none" stroke="#F5E6C8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="185" cy="193" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="220" cy="198" r="3" fill="#FF6B4A" opacity="0.8"/>
  <circle cx="256" cy="200" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="292" cy="198" r="3" fill="#FF6B4A" opacity="0.8"/>
  <circle cx="327" cy="193" r="3" fill="#FFD700" opacity="0.8"/>

  <!-- Cabin/upper deck structure -->
  <rect x="190" y="230" width="132" height="40" rx="3" fill="#B8845A"/>
  <rect x="200" y="238" width="24" height="20" rx="2" fill="#1A3A5C" opacity="0.7"/>
  <rect x="232" y="238" width="24" height="20" rx="2" fill="#1A3A5C" opacity="0.7"/>
  <rect x="264" y="238" width="24" height="20" rx="2" fill="#1A3A5C" opacity="0.7"/>
  <rect x="296" y="238" width="18" height="24" rx="2" fill="#1A3A5C" opacity="0.5"/>

  <!-- Text: SCHALUPPE -->
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#F5E6C8">SCHALUPPE</text>
</svg>
